<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Perfil - UBS CONECTA</title>
    <link rel="shortcut icon"
        href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgf41pwBOzpV8SNo_nYFOdOALQ44OQ4b7UvVzKovz7TGHJqogyJ_ce8-MPmmr3lJuZpzsmEaelJ2c6ZZmJ2yM0a1foCkG8gHvr-DVrdCvhR7ZFl2fOUjuYYROwtCXpkP2DKMsBqxusFSozHhijh3Ne1ars5VFzzF-1WrKqMsklK3A1EaNhH-x3qAVrlOwI/s320-rw/UBS%20CONECTA%20-%20LOGO%20ORIGEM.png"
        type="image/x-icon">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link rel="stylesheet" href="completar_perfil.css">
</head>

<body>

    <header>
        <div class="logomarca">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgf41pwBOzpV8SNo_nYFOdOALQ44OQ4b7UvVzKovz7TGHJqogyJ_ce8-MPmmr3lJuZpzsmEaelJ2c6ZZmJ2yM0a1foCkG8gHvr-DVrdCvhR7ZFl2fOUjuYYROwtCXpkP2DKMsBqxusFSozHhijh3Ne1ars5VFzzF-1WrKqMsklK3A1EaNhH-x3qAVrlOwI/s320-rw/UBS%20CONECTA%20-%20LOGO%20ORIGEM.png"
                alt="UBS Conecta Logo">
            <a href="ubs_conecta.html" class="logo">UBS CONECTA</a>
        </div>
        <nav>
            <a href="ubs_conecta.html" class="btn-link">Página principal</a>
            <a href="und.html" class="btn-link">Unidades</a>
        </nav>
    </header>

    <main class="container-perfil">
        <div class="header-perfil">
            <h1>Completar Perfil</h1>
            <div id="badgeTipo" class="badge-tipo">
                <i id="badgeIcon" class="bxf bx-user"></i>
                <span id="tipoEscolhido">Carregando...</span>
            </div>
            <p class="subtitulo">Preencha as informações abaixo para ter acesso completo ao sistema UBS Conecta.</p>
        </div>

        <form id="formPerfil" class="formulario-perfil">

            <!-- Seção Dados Pessoais -->
            <div class="secao-card">
                <div class="secao-titulo">
                    <i class="bxf bx-id-card"></i>
                    <h2>Dados Pessoais</h2>
                </div>

                <div class="grid-campos">
                    <div class="campo-grupo campo-full">
                        <label for="nome">Nome completo <span class="obrigatorio">*</span></label>
                        <div class="input-com-icone">
                            <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                            <i class="bxf bx-user"></i>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="cpf">CPF <span class="obrigatorio">*</span></label>
                        <div class="input-com-icone">
                            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                            <i class="bxf bx-user-id-card"></i>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="rg">RG</label>
                        <div class="input-com-icone">
                            <input type="text" id="rg" placeholder="Digite seu RG">
                            <i class="bxf bx-file"></i>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <div class="input-com-icone">
                            <input type="date" id="dataNascimento">
                            <i class="bxf bx-calendar"></i>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <div class="input-com-icone">
                            <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                            <i class="bxf bx-phone"></i>
                        </div>
                    </div>

                    <div class="campo-grupo campo-full">
                        <label for="email">E-mail <span class="obrigatorio">*</span></label>
                        <div class="input-com-icone">
                            <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                            <i class="bxf bx-envelope"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Seção Dados Profissionais (Exibido se tipo === PROFISSIONAL) -->
            <section id="dadosProfissional" class="secao-card secao-profissional" hidden>
                <div class="secao-titulo profissional">
                    <i class="bxf bx-first-aid"></i>
                    <h2>Dados Profissionais</h2>
                </div>

                <div class="grid-campos">
                    <div class="campo-grupo">
                        <label for="cargo">Cargo / Função <span class="obrigatorio">*</span></label>
                        <div class="input-com-icone">
                            <input type="text" id="cargo" placeholder="Ex: Médico, Enfermeiro, etc.">
                            <i class="bxf bx-briefcase"></i>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="conselhoProfissional">Conselho Profissional <span
                                class="obrigatorio">*</span></label>
                        <div class="select-com-icone">
                            <select id="conselhoProfissional">
                                <option value="">Selecione o conselho</option>
                                <option value="CRM">CRM (Medicina)</option>
                                <option value="COREN">COREN (Enfermagem)</option>
                                <option value="CRO">CRO (Odontologia)</option>
                                <option value="CRF">CRF (Farmácia)</option>
                                <option value="Outro">Outro</option>
                            </select>
                            <i class="bxf bx-chevron-down"></i>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="registroProfissional">Nº de Registro Profissional <span
                                class="obrigatorio">*</span></label>
                        <div class="input-com-icone">
                            <input type="text" id="registroProfissional" placeholder="Ex: 123456/UF">
                            <i class="bxf bx-badge-check"></i>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="especialidade">Especialidade</label>
                        <div class="input-com-icone">
                            <input type="text" id="especialidade" placeholder="Ex: Clínica Geral, Pediatria...">
                            <i class="bxf bx-award"></i>
                        </div>
                    </div>

                    <div class="campo-grupo campo-full">
                        <label for="idUbs">UBS de Atuação <span class="obrigatorio">*</span></label>
                        <div class="select-com-icone">
                            <select id="idUbs">
                                <option value="">Selecione a Unidade de Saúde</option>
                                <option value="1">UBS Central</option>
                                <option value="2">UBS Bairro Novo</option>
                            </select>
                            <i class="bxf bx-building-house"></i>
                        </div>
                    </div>
                </div>
            </section>

            <div class="acoes-formulario">
                <button type="submit" class="btn-salvar">
                    <span>Salvar e Concluir Perfil</span>
                    <i class="bxf bx-check-circle"></i>
                </button>
            </div>
        </form>
    </main>


    <script>
        const parametros = new URLSearchParams(window.location.search);
        const tipo = parametros.get("tipo");
        const idUsuario = parametros.get("idUsuario");

        const formulario = document.querySelector("#formPerfil");
        const texto = document.querySelector("#tipoEscolhido");
        const dadosProfissional = document.querySelector("#dadosProfissional");
        const badgeIcon = document.querySelector("#badgeIcon");
        const selectUbs = document.querySelector("#idUbs");

        const API = "http://localhost:8080";

        if (tipo === "PACIENTE") {
            texto.textContent = "Cadastro Complementar: Paciente";
            badgeIcon.className = "bxf bx-user";

        } else if (tipo === "PROFISSIONAL") {
            texto.textContent = "Cadastro Complementar: Profissional de Saúde";
            badgeIcon.className = "bxf bx-medical-kit";
            dadosProfissional.hidden = false;

            document.querySelector("#cargo").required = true;
            document.querySelector("#conselhoProfissional").required = true;
            document.querySelector("#registroProfissional").required = true;
            document.querySelector("#idUbs").required = true;

            carregarUbs();

        } else {
            texto.textContent = "Tipo de cadastro inválido. Retorne ao registro.";
            formulario.hidden = true;
        }

        async function carregarUbs() {
            try {
                const resposta = await fetch(`${API}/api/ubs`);

                if (!resposta.ok) {
                    throw new Error("Não foi possível carregar as UBS.");
                }

                const unidades = await resposta.json();

                selectUbs.innerHTML =
                    '<option value="">Selecione uma UBS</option>';

                unidades.forEach(ubs => {
                    const opcao = document.createElement("option");
                    opcao.value = ubs.id;
                    opcao.textContent = ubs.nomeUbs;
                    selectUbs.appendChild(opcao);
                });

            } catch (erro) {
                console.error(erro);
                selectUbs.innerHTML =
                    '<option value="">Erro ao carregar UBS</option>';
            }
        }

        formulario.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!idUsuario) {
                alert("ID da conta não encontrado. Faça o cadastro novamente.");
                return;
            }

            const dados = {
                idUsuario: Number(idUsuario),
                nome: document.querySelector("#nome").value.trim(),
                cpf: document.querySelector("#cpf").value.trim(),
                rg: document.querySelector("#rg").value.trim(),
                dataNascimento:
                    document.querySelector("#dataNascimento").value || null,
                telefone: document.querySelector("#telefone").value.trim(),
                email: document.querySelector("#email").value.trim()
            };

            if (tipo === "PROFISSIONAL") {
                dados.cargo = document.querySelector("#cargo").value.trim();
                dados.conselhoProfissional =
                    document.querySelector("#conselhoProfissional").value;
                dados.registroProfissional =
                    document.querySelector("#registroProfissional").value.trim();
                dados.especialidade =
                    document.querySelector("#especialidade").value.trim();
                dados.idUbs = Number(selectUbs.value);
            }

            try {
                const resposta = await fetch(`${API}/api/perfis/completar`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                const textoResposta = await resposta.text();

                console.log("Status HTTP:", resposta.status);
                console.log("Resposta do backend:", textoResposta);

                let resultado = {};

                try {
                    resultado = textoResposta ? JSON.parse(textoResposta) : {};
                } catch (erro) {
                    resultado = { mensagem: textoResposta };
                }

                if (!resposta.ok) {
                    throw new Error(
                        resultado.erro ||
                        resultado.mensagem ||
                        resultado.message ||
                        `Erro HTTP ${resposta.status}`
                    );
                }

                alert(resultado.mensagem || "Perfil completado com sucesso!");
                window.location.href = "pg_login.html";

            } catch (erro) {
                console.error(erro);
                alert(erro.message || "Erro ao conectar com o servidor.");
            }
        });
    </script>

</body>

</html>
