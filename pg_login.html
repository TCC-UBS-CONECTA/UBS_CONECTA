<head>
    <meta charset="UTF-8">

        href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgf41pwBOzpV8SNo_nYFOdOALQ44OQ4b7UvVzKovz7TGHJqogyJ_ce8-MPmmr3lJuZpzsmEaelJ2c6ZZmJ2yM0a1foCkG8gHvr-DVrdCvhR7ZFl2fOUjuYYROwtCXpkP2DKMsBqxusFSozHhijh3Ne1ars5VFzzF-1WrKqMsklK3A1EaNhH-x3qAVrlOwI/s320-rw/UBS%20CONECTA%20-%20LOGO%20ORIGEM.png"
        type="image/x-icon">
    <link rel="stylesheet" href="pg_login.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/ea68365d10.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="logomarca">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgf41pwBOzpV8SNo_nYFOdOALQ44OQ4b7UvVzKovz7TGHJqogyJ_ce8-MPmmr3lJuZpzsmEaelJ2c6ZZmJ2yM0a1foCkG8gHvr-DVrdCvhR7ZFl2fOUjuYYROwtCXpkP2DKMsBqxusFSozHhijh3Ne1ars5VFzzF-1WrKqMsklK3A1EaNhH-x3qAVrlOwI/s320-rw/UBS%20CONECTA%20-%20LOGO%20ORIGEM.png"
                onclick="home('#home')">
            <a href="#" class="logo">UBS CONECTA</a>
        </div>
        <nav>
            <a href="ubs_conecta.html" class="btn-link">Página principal</a>
            <a href="und.html" class="btn-link">Unidades</a>
        </nav>
    </header>

    <div class="formulario">
        <h1>Conecte-se</h1>
        <p class="subtitulo">Sistema de atendimento da UBS</p>

        <form action="#" method="post">

            <div class="caixa-formulario">
                <input type="email" placeholder="E-mail" required>
                <i class="bxf bx-user"></i>
            </div>

            <div class="caixa-formulario">
                <input type="password" placeholder="Senha" maxlength="12" size="12" required>
                <i class="bxf bx-lock"></i>
            </div>

            <div class="caixa-lembrar-esqueci">
                <label><input type="checkbox">Lembrar</label>

                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit">Entrar</button>

            <div class="icon-social">
                <a href="#" class="iconAZUL"><i class="fa-brands fa-google-plus-g" style="color: rgb(13, 71, 161);"></i></a>
                <a href="#" class="iconVERMELHO"><i class="fa-brands fa-facebook-f" style="color: rgb(253, 207, 22);"></i></a>
                <a href="#" class="iconAMARELO"><i class="fa-brands fa-apple" style="color: rgb(228, 28, 33);"></i></a>
                <a href="#" class="iconVERDE"><i class="fa-brands fa-linkedin-in" style="color: rgb(75, 174, 51);"></i></a>
            </div>

            <div class="link-registro">
                <p>Não tem conta?
                    <a href="pg_registro.html">Registrar</a>
                </p>
            </div>
        </form>
    </div>
    
</body> 

</html>
